[package]
name = "puzzle-path-tool"

description = "Programmatically construct and generate Sudoku puzzles."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["sudoku", "gamedev", "generator", "random", "tool"]
categories = ["game-development", "development-tools"]

include = ["**/*.rs", "Cargo.toml"]

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bench]]
name = "benchmark"
harness = false

[lints]
workspace = true

[dependencies]
puzzle-core = { workspace = true }
puzzle-core-macros = { workspace = true }
puzzle-formats = { workspace = true }
puzzle-pack-bindings = { workspace = true }
puzzle-pack-scripts = { workspace = true }

[dev-dependencies]
divan = "0.1.21"

[build-dependencies]
puzzle-pack-scripts = { workspace = true }
