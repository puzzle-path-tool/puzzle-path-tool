[package]
name = "puzzle-pack-scripts"

description = "Typescript scripts and engine for `puzzle-path-tool` crate."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["internal"]
categories = ["development-tools"]

include = [
  "**/*.rs",
  "Cargo.toml",
  "ts/.editorconfig",
  "ts/.gitignore",
  "ts/eslint.config.js",
  "ts/package.json",
  "ts/package-lock.json",
  "ts/tsconfig.json",
  "ts/puzzles/example.ts",
  "ts/packs/**/*.ts",
  "!ts/packs/api/puzzpt_api.ts",
  "!ts/node_modules",
  "!ts/node_modules/**/*",
]

version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
const_format = "0.2.34"
iftree = "1.0.6"
indoc = "2.0.6"
itertools = "0.14.0"
puzzle-core = { workspace = true }
puzzle-core-macros = { workspace = true }
puzzle-formats = { workspace = true }
puzzle-pack-bindings = { workspace = true }
rquickjs = "0.9.0"
rquickjs-serde = "0.1.0"
serde = "1.0.219"
serde_json = "1.0.140"
swc = "26.0.0"
swc_common = { version = "12.0.1", features = ["sourcemap"] }
swc_ecma_ast = "12.0.0"
swc_ecma_codegen = "14.0.0"
swc_ecma_parser = "15.0.1"
swc_ecma_transforms_base = "16.0.0"
swc_ecma_transforms_typescript = "18.0.0"
swc_ecma_visit = "12.0.0"

[build-dependencies]
puzzle-pack-bindings = { workspace = true }
