name: "Typescript"

on:
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: "Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/puzzle_path_tool/package-lock.json

      - name: Install packages
        working-directory: crates/puzzle_path_tool
        run: npm install

      - name: Run check
        working-directory: crates/puzzle_path_tool
        run: npm run check

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/puzzle_path_tool/package-lock.json

      - name: Install packages
        working-directory: crates/puzzle_path_tool
        run: npm install

      - name: Run lint
        working-directory: crates/puzzle_path_tool
        run: npm run lint

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/puzzle_path_tool/package-lock.json

      - name: Install packages
        working-directory: crates/puzzle_path_tool
        run: npm install

      - name: Run test
        working-directory: crates/puzzle_path_tool
        run: npm run test

  format:
    name: "Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/puzzle_path_tool/package-lock.json

      - name: Install packages
        working-directory: crates/puzzle_path_tool
        run: npm install

      - name: Run format-check
        working-directory: crates/puzzle_path_tool
        run: npm run format-check
